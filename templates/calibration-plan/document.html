<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<style>
body{font:16px/1.65 "Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;margin:36px;color:#111;background:#fff}
main{max-width:1480px;margin:auto}h1{font-size:38px;line-height:1.25;letter-spacing:-1px;border-top:5px solid #e63329;padding-top:20px}h2{font-size:20px;margin-top:32px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:10px;border:1px solid #d6d6d0;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:#f2f2ee}summary{cursor:pointer;padding:12px;background:#f5f5f2}details{margin:12px 0}
.status{padding:14px 18px;border-left:4px solid #e63329;background:#f2f2ee}
@media(max-width:760px){body{margin:16px}table{font-size:12px}td,th{padding:6px}h1{font-size:23px}}
@media print{body{margin:12mm;font-size:11pt}details{break-inside:avoid}}
</style>
<main>
<h1>$title</h1>
<p class="status">状态：$state；方案版本：$revision。<br>$summary</p>
<p>标为“原文待核验”的内容仅用于核对候选方案，尚未作为技术判据采纳。</p>
<table><thead><tr>$headers</tr></thead><tbody>$rows</tbody></table>
<h2>待处理事项</h2><ul>$issues</ul>
<h2>原方案字段摘录</h2>$raw_sections
</main>
</html>
